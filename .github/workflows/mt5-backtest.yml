# MT5 Strategy Tester backtest - AutoTrade EA (one-off, manual trigger)
#
# Status: run #1 (2026-11-18) FAILED at the compile step - MetaEditor produced
# no compile log (not an EA syntax error; pre-flight broker login passed, so
# the Secrets are correct). Run #2 (2026-11-18) FAILED the same step in 0s:
# the rewritten PowerShell FAILED TO PARSE - an em-dash inside a double-quoted
# string broke the runner's script parsing before anything executed (the
# "131 sample files" reading was wrong - that log came from the MT5
# install/pre-flight, not the compile step). FIX: all em-dashes removed from
# the workflow's PowerShell (ASCII-only). Run #3 (2026-11-18) SUCCESS:
# AutoTrade.mq5 compiled CLEAN (0 errors, 0 warnings) - compile problem
# SOLVED. But the backtest was EMPTY: 0 trades, Bars 0, Ticks 0, History
# Quality 0%, Initial Deposit 0.00, Leverage 1:100, Symbols 0 - the tester
# ran with no account logged in and no history synced. FIX #3: a history-sync
# step runs the SyncHistory script (ea/SyncHistory.mq5) before the tester:
# it logs in, force-downloads XAUUSD M1 history for 2026.08.01-2026.10.19
# via CopyRates, and writes MQL5\Files\sync-result.txt; the step fails fast
# unless the terminal is connected and >= 50000 M1 bars arrived.
# Run #4 (2026-11-18) FAILED at the sync step: step 9 timed out after 600s -
# sync-result.txt was never created. The script compiled clean but never ran:
# the pre-flight terminal spent its 120s on first-run recompilation +
# LiveUpdate and never logged in, and the sync terminal wrote only startup
# lines then total silence for 10 min. Prince verified the server name from
# the HFM app (HFMarketsGlobal-Demo 4, login 235368272) - the secret is
# CORRECT. Root cause: on a fresh runner the terminal never attempts a login
# from the [Common] section of /config: ini files (no saved session exists
# yet, and the password in the ini is not used to create one). FIX #4: a new
# seed step logs in once via the MetaTrader5 Python package (its login saves
# the account into the terminal data folder), the pre-flight becomes a hard
# gate (fails unless a login marker appears in the journal within 600s),
# and the sync step polls the journal while waiting.
#
# No credentials live in this repo. The demo login/password/server come from
# GitHub Secrets (HFM_MT5_LOGIN / HFM_MT5_PASSWORD / HFM_MT5_SERVER) and are
# injected into tester.ini on the runner only. The generated tester.ini and
# login.ini are NEVER uploaded as artifacts.
#
# What it does:
#   1. Installs MT5 silently on a windows-latest runner (direct internet, so
#      the terminal can reach the HFM server and sync history - the thing the
#      local VM could not do).
#   2. Seeds the broker login once via the MetaTrader5 Python package (run #4
#      proved the terminal never logs in from /config: ini files on a fresh
#      runner - the package login saves the account into the data folder).
#   3. Pre-flight broker-login check (hard gate - fails unless a login marker
#      appears in the journal within 600s).
#   4. Compiles AutoTrade.mq5 + SyncHistory.mq5 with MetaEditor (0 errors,
#      0 warnings required for both).
#   5. Syncs XAUUSD M1 history: runs the SyncHistory script in the logged-in
#      terminal and fails fast unless >= 50000 M1 bars arrived (run #3 proved
#      the tester starts with 0 bars if history is not synced first).
#   6. Runs terminal64.exe headless with /config:tester.ini ([Tester] section,
#      ShutdownTerminal=1) - min-lot logic test on the $100 HFM demo.
#   7. Uploads the tester report (.htm + equity chart), terminal journal logs,
#      compile log, .set and tester.ini.template as an artifact.

name: MT5 Backtest - AutoTrade EA

run-name: Backtest AutoTrade ${{ inputs.from_date }} → ${{ inputs.to_date }} (Model ${{ inputs.model }})

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Backtest start date (YYYY.MM.DD)'
        required: true
        default: '2026.08.03'
      to_date:
        description: 'Backtest end date (YYYY.MM.DD)'
        required: true
        default: '2026.10.16'
      model:
        description: 'Modeling: 1 = 1-minute OHLC (fast, right for an H1 EA), 0 = every tick, 4 = real ticks'
        required: true
        default: '1'
      deposit:
        description: 'Tester deposit in USD (prince decision 16 Nov: 100 = min-lot logic test)'
        required: true
        default: '100'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: windows-latest
    timeout-minutes: 360  # GitHub job cap is 6h; the tester step below caps at 300 min
    env:
      MT5_DIR: 'C:\Program Files\MetaTrader 5'

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download MT5 installer (MetaQuotes)
        shell: powershell
        run: |
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
          $out = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $out
          $size = (Get-Item $out).Length
          if ($size -lt 10MB) { throw "Installer download looks incomplete: $size bytes" }
          Write-Host "Installer downloaded: $size bytes"

      - name: Install MT5 silently
        shell: powershell
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Start-Process -FilePath $setup -ArgumentList '/auto' -Wait
          $terminal = Join-Path $env:MT5_DIR 'terminal64.exe'
          $editor = Join-Path $env:MT5_DIR 'MetaEditor64.exe'
          if (-not (Test-Path $terminal)) { throw "terminal64.exe not found at $terminal after install" }
          if (-not (Test-Path $editor)) { throw "MetaEditor64.exe not found at $editor after install" }
          Write-Host 'MT5 installed.'

      - name: Generate tester.ini + login.ini + history.ini from templates + secrets
        shell: powershell
        env:
          HFM_MT5_LOGIN: ${{ secrets.HFM_MT5_LOGIN }}
          HFM_MT5_PASSWORD: ${{ secrets.HFM_MT5_PASSWORD }}
          HFM_MT5_SERVER: ${{ secrets.HFM_MT5_SERVER }}
          BT_FROM_DATE: ${{ inputs.from_date }}
          BT_TO_DATE: ${{ inputs.to_date }}
          BT_MODEL: ${{ inputs.model }}
          BT_DEPOSIT: ${{ inputs.deposit }}
        run: .\scripts\prepare-tester-config.ps1

      - name: Seed broker login via MetaTrader5 Python
        shell: powershell
        timeout-minutes: 15
        env:
          HFM_MT5_LOGIN: ${{ secrets.HFM_MT5_LOGIN }}
          HFM_MT5_PASSWORD: ${{ secrets.HFM_MT5_PASSWORD }}
          HFM_MT5_SERVER: ${{ secrets.HFM_MT5_SERVER }}
        run: |
          python -m pip install --quiet MetaTrader5
          if ($LASTEXITCODE -ne 0) { throw 'pip install MetaTrader5 failed.' }
          python scripts\seed_login.py
          if ($LASTEXITCODE -ne 0) { throw 'Seed login failed - the terminal could not log in to HFM. See the script output above.' }
          Write-Host 'Waiting for any terminal64.exe process to exit (lock release)...'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            $running = Get-Process terminal64 -ErrorAction SilentlyContinue
            if ($null -eq $running) { break }
            Start-Sleep -Seconds 5
          }
          if ($null -ne (Get-Process terminal64 -ErrorAction SilentlyContinue)) {
            Write-Warning 'terminal64.exe still running after seed shutdown - stopping it.'
            Stop-Process -Name terminal64 -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 10
          }
          Write-Host 'Seed login done.'

      - name: Pre-flight broker-login check (hard gate - must see a login marker)
        shell: powershell
        timeout-minutes: 15
        run: |
          Set-Location $env:MT5_DIR
          $proc = Start-Process -FilePath (Join-Path $env:MT5_DIR 'terminal64.exe') -ArgumentList '/portable','/config:login.ini' -WorkingDirectory $env:MT5_DIR -PassThru
          Write-Host "Terminal started for login check (PID $($proc.Id)). Polling journal up to 600s for a login marker..."
          $deadline = (Get-Date).AddSeconds(600)
          $loggedIn = $false
          $failed = $false
          while ((Get-Date) -lt $deadline) {
            $journal = ''
            $logsDir = Join-Path $env:MT5_DIR 'Logs'
            if (Test-Path $logsDir) {
              $logFile = Get-ChildItem $logsDir -Filter '*.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($null -ne $logFile) { $journal = Get-Content -Raw -Path $logFile.FullName }
            }
            # Explicit trade-login failure markers. NOTE: 'MQL5.community authorization
            # failed' is a harmless periodic line - it is deliberately NOT matched here.
            if ($journal -match 'login failed|invalid account|no connection|cannot connect|account disabled') { $failed = $true; break }
            if ($journal -match 'logged in|login on|connected to|authorized on') { $loggedIn = $true; break }
            if ($proc.HasExited) { break }
            Start-Sleep -Seconds 30
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $proc.WaitForExit(60000)) { Write-Warning 'Pre-flight terminal did not exit within 60s after stop.' }
          Start-Sleep -Seconds 10
          if ($failed) { throw 'Broker login FAILED (journal shows an explicit failure marker). Check HFM_MT5_LOGIN / HFM_MT5_PASSWORD / HFM_MT5_SERVER secrets.' }
          if (-not $loggedIn) {
            Write-Host '--- journal tail ---'
            $logsDir = Join-Path $env:MT5_DIR 'Logs'
            if (Test-Path $logsDir) {
              Get-ChildItem $logsDir -Filter '*.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | ForEach-Object {
                Get-Content -Tail 30 $_.FullName -ErrorAction SilentlyContinue | Write-Host
              }
            }
            throw 'Broker login NOT confirmed within 600s - no login marker in the journal. The terminal never logged in (fresh-runner first-run issue). See journal tail above.'
          }
          Write-Host 'Pre-flight login confirmed by journal marker.'

      - name: Install EA, sync script and .set file
        shell: powershell
        run: |
          $experts = Join-Path $env:MT5_DIR 'MQL5\Experts'
          $scripts = Join-Path $env:MT5_DIR 'MQL5\Scripts'
          $testerProfiles = Join-Path $env:MT5_DIR 'MQL5\Profiles\Tester'
          New-Item -ItemType Directory -Force -Path $experts, $scripts, $testerProfiles | Out-Null
          Copy-Item 'ea\AutoTrade.mq5' (Join-Path $experts 'AutoTrade.mq5')
          Copy-Item 'ea\SyncHistory.mq5' (Join-Path $scripts 'SyncHistory.mq5')
          Copy-Item 'ea\AutoTrade.set' (Join-Path $testerProfiles 'AutoTrade.set')
          Write-Host 'EA + sync script + .set installed into the portable data folder.'

      - name: Compile EA + sync script with MetaEditor
        shell: powershell
        run: |
          Set-Location $env:MT5_DIR
          $editor = Join-Path $env:MT5_DIR 'MetaEditor64.exe'
          if (-not (Test-Path $editor)) { throw "MetaEditor64.exe not found at $editor" }
          $outFile = Join-Path $env:RUNNER_TEMP 'metaeditor-stdout.txt'
          $errFile = Join-Path $env:RUNNER_TEMP 'metaeditor-stderr.txt'
          function Invoke-MetaEditor {
            param([string]$Src, [string]$Log, [string[]]$ExtraArgs)
            $argList = $ExtraArgs + "/compile:`"$Src`"", "/log:`"$Log`""
            Write-Host "Running: $editor $($argList -join ' ')"
            $p = Start-Process -FilePath $editor -ArgumentList $argList -WorkingDirectory $env:MT5_DIR -Wait -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            Write-Host "MetaEditor exit code: $($p.ExitCode) (note: MetaEditor exits 1 even on a successful compile - the log is authoritative)"
            if (Test-Path $outFile) { Write-Host '--- MetaEditor stdout ---'; Get-Content $outFile | Write-Host }
            if (Test-Path $errFile) { Write-Host '--- MetaEditor stderr ---'; Get-Content $errFile | Write-Host }
          }
          function Compile-One {
            param([string]$SrcRel, [string]$LogName, [string]$Ex5Rel)
            $src = Join-Path $env:MT5_DIR $SrcRel
            $log = Join-Path $env:MT5_DIR $LogName
            $ex5 = Join-Path $env:MT5_DIR $Ex5Rel
            if (-not (Test-Path $src)) { throw "$SrcRel not found at $src" }
            # Attempt 1: portable mode (data folder = MT5_DIR), absolute paths.
            Invoke-MetaEditor -Src $src -Log $log -ExtraArgs @('/portable')
            if (-not (Test-Path $log)) {
              Write-Warning "No compile log for $SrcRel after /portable attempt - retrying without /portable (data folder under %APPDATA%)."
              Invoke-MetaEditor -Src $src -Log $log -ExtraArgs @()
              # MetaEditor without /portable writes into %APPDATA%\MetaQuotes\Terminal\<id> - look there.
              $appDataTerminals = Join-Path $env:APPDATA 'MetaQuotes\Terminal'
              if ((-not (Test-Path $log)) -and (Test-Path $appDataTerminals)) {
                $foundLog = Get-ChildItem -Recurse -Filter ([System.IO.Path]::GetFileName($log)) $appDataTerminals -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($null -ne $foundLog) {
                  Write-Host "Found compile log at $($foundLog.FullName) - copying to $log"
                  Copy-Item $foundLog.FullName $log
                }
                $foundEx5 = Get-ChildItem -Recurse -Filter ([System.IO.Path]::GetFileName($ex5)) $appDataTerminals -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($null -ne $foundEx5) {
                  Write-Host "Found compiled file at $($foundEx5.FullName) - copying to $ex5"
                  Copy-Item $foundEx5.FullName $ex5
                }
              }
            }
            if (-not (Test-Path $log)) { throw "Compile log not produced for $SrcRel - MetaEditor did not run. See captured stdout/stderr above." }
            $text = Get-Content -Raw -Path $log
            Write-Host $text
            if ($text -notmatch '0 errors, 0 warnings') { throw "$SrcRel compile did not report 0 errors, 0 warnings. See log above." }
            if (-not (Test-Path $ex5)) { throw "$Ex5Rel missing after compile." }
            Write-Host "$SrcRel compiled clean: 0 errors, 0 warnings."
          }
          Compile-One -SrcRel 'MQL5\Experts\AutoTrade.mq5' -LogName 'MQL5\Experts\AutoTrade-compile.log' -Ex5Rel 'MQL5\Experts\AutoTrade.ex5'
          Compile-One -SrcRel 'MQL5\Scripts\SyncHistory.mq5' -LogName 'MQL5\Scripts\SyncHistory-compile.log' -Ex5Rel 'MQL5\Scripts\SyncHistory.ex5'

      - name: Sync XAUUSD history (login + download before tester)
        shell: powershell
        timeout-minutes: 15
        run: |
          Set-Location $env:MT5_DIR
          $scriptEx5 = Join-Path $env:MT5_DIR 'MQL5\Scripts\SyncHistory.ex5'
          $historyIni = Join-Path $env:MT5_DIR 'history.ini'
          if (-not (Test-Path $scriptEx5)) { throw 'SyncHistory.ex5 missing - compile step did not produce it.' }
          if (-not (Test-Path $historyIni)) { throw 'history.ini missing - config step did not produce it.' }
          $resultFile = Join-Path $env:MT5_DIR 'MQL5\Files\sync-result.txt'
          if (Test-Path $resultFile) { Remove-Item $resultFile -Force }
          $proc = Start-Process -FilePath (Join-Path $env:MT5_DIR 'terminal64.exe') -ArgumentList '/portable','/config:history.ini' -WorkingDirectory $env:MT5_DIR -PassThru
          Write-Host "Terminal started for history sync (PID $($proc.Id)). Waiting up to 600s for sync-result.txt..."
          $deadline = (Get-Date).AddSeconds(600)
          $found = $false
          $seenLines = 0
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $resultFile) { $found = $true; break }
            if ($proc.HasExited) { break }
            $logsDir = Join-Path $env:MT5_DIR 'Logs'
            if (Test-Path $logsDir) {
              $logFile = Get-ChildItem $logsDir -Filter '*.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($null -ne $logFile) {
                $lines = @(Get-Content -Path $logFile.FullName -ErrorAction SilentlyContinue)
                if ($lines.Count -gt $seenLines) {
                  $lines[$seenLines..($lines.Count - 1)] | ForEach-Object { Write-Host "journal: $_" }
                  $seenLines = $lines.Count
                }
              }
            }
            Start-Sleep -Seconds 30
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $proc.WaitForExit(60000)) { Write-Warning 'Sync terminal did not exit within 60s after stop.' }
          Start-Sleep -Seconds 10
          if (-not $found) {
            Write-Host '--- journal tail (every log location) ---'
            $logsDirs = @((Join-Path $env:MT5_DIR 'Logs'))
            $appDataTerminals = Join-Path $env:APPDATA 'MetaQuotes\Terminal'
            if (Test-Path $appDataTerminals) { $logsDirs += Get-ChildItem $appDataTerminals -Directory | ForEach-Object { Join-Path $_.FullName 'Logs' } }
            foreach ($ld in $logsDirs) {
              if (Test-Path $ld) {
                Get-ChildItem $ld -Filter '*.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object {
                  Write-Host "== $($_.FullName) =="
                  Get-Content -Tail 20 $_.FullName -ErrorAction SilentlyContinue | Write-Host
                }
              }
            }
            throw 'History sync did not produce sync-result.txt within 600s - the SyncHistory script did not run. See journal lines above (the pre-flight gate already confirmed a login, so check the [Experts] Script key in history.ini).'
          }
          $content = Get-Content -Raw -Path $resultFile
          Write-Host $content
          $bars = 0
          $connected = 0
          if ($content -match 'M1_BARS=(-?\d+)') { $bars = [int]$Matches[1] }
          if ($content -match 'TERMINAL_CONNECTED=(\d+)') { $connected = [int]$Matches[1] }
          if ($connected -ne 1) { throw 'History sync: terminal NOT connected to the HFM server (TERMINAL_CONNECTED=0). The server name was verified correct from the HFM app - check the journal lines in the artifact.' }
          if ($bars -lt 50000) { throw "History sync: only $bars M1 bars for XAUUSD (need at least 50000 for the Aug-Oct window). History did not download - check the journal in the artifact." }
          Write-Host "History sync OK: $bars M1 bars for XAUUSD, terminal connected."

      - name: Run Strategy Tester (headless)
        shell: powershell
        timeout-minutes: 300
        run: |
          Set-Location $env:MT5_DIR
          $proc = Start-Process -FilePath (Join-Path $env:MT5_DIR 'terminal64.exe') -ArgumentList '/portable','/config:tester.ini' -WorkingDirectory $env:MT5_DIR -PassThru
          Write-Host "Terminal started (PID $($proc.Id)). Waiting up to 270 minutes for ShutdownTerminal=1 to close it..."
          if (-not $proc.WaitForExit(270 * 60 * 1000)) {
            Write-Warning 'Tester did not exit within 270 minutes - stopping terminal.'
            $proc.Kill()
            throw 'Strategy Tester timed out (270 min). Journal logs are collected below for diagnosis.'
          }
          Write-Host "Terminal exited with code $($proc.ExitCode)."

      - name: Collect results
        if: always()
        shell: powershell
        run: .\scripts\collect-results.ps1

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-backtest-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
